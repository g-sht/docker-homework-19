<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docker-homework-19</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1d2330; margin: 0; }
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .meta { color: #667; font-size: .9rem; }
    button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    pre { background: #11151f; color: #e6e9f0; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .85rem; background: #ddd; }
    .ok { background: #c8f0d2; color: #14532d; }
    .fail { background: #f8d0d0; color: #7f1d1d; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Контейнерный стенд · вариант 19</h1>
    <p class="meta">docker-homework-19</p>
    <p>Статус backend: <span id="status" class="status">проверка…</span></p>
    <button id="refresh">Обновить</button>
    <h3>Ответ <code>/api/info</code></h3>
    <pre id="out">—</pre>
  </div>
</main>
<script>
  const out = document.getElementById('out');
  const status = document.getElementById('status');

  async function check() {
    status.textContent = 'проверка…';
    status.className = 'status';
    try {
      const res = await fetch('/api/info');
      const text = await res.text();
      out.textContent = `HTTP ${res.status}\n\n${text}`;
      status.textContent = res.ok ? 'доступен' : 'ошибка';
      status.className = 'status ' + (res.ok ? 'ok' : 'fail');
    } catch (e) {
      out.textContent = String(e);
      status.textContent = 'недоступен';
      status.className = 'status fail';
    }
  }

  document.getElementById('refresh').addEventListener('click', check);
  check();
</script>
</body>
</html>
